                - paragraph [ref=e372]: 基于《XCT80L7市场调研报告》相关资料，对80t汽车起重机市场需求分析如下：
                - heading "一、市场规模与需求概况" [level=2] [ref=e476]
                - paragraph [ref=e477]: 调研数据显示，80t级汽车起重机国内年需求约850台，租赁市场保有量约3200台。主要客户群体包括吊装公司（工况占比30%）、塔机租赁商（占比25%）、风电安装企业（占比18%）、基建总包（占比15%）及其他用户（占比12%）。
                - heading "二、市场趋势分析" [level=2] [ref=e478]
                - paragraph [ref=e479]:
                  - text: "1."
                  - strong [ref=e480]: 基建投资持续增长
                  - text: ：基建投资年增约8%，基础工程、隧道、港口等场景对80t级起重机的需求稳步上升。
                - paragraph [ref=e481]:
                  - text: "2."
                  - strong [ref=e482]: 风电维保需求释放
                  - text: ：年新增风电场120个以上，风电检修和叶片更换对大臂长、稳定变幅性能的需求日益突出。
                - paragraph [ref=e483]:
                  - text: "3."
                  - strong [ref=e484]: 租赁市场成熟
                  - text: ：租赁市场保有量可观，高频转场工况要求设备具备更好的转场效率和自重控制优势。
                - heading "三、客户核心诉求" [level=2] [ref=e485]
                - list [ref=e486]:
                  - listitem [ref=e487]:
                    - paragraph [ref=e488]:
                      - strong [ref=e489]: 吊装公司
                      - text: ：起重能力余量不足、主臂长度受限，需要更优的臂架性能。
                  - listitem [ref=e490]:
                    - paragraph [ref=e491]:
                      - strong [ref=e492]: 塔机租赁商
                      - text: ：对转场效率与自重敏感，期望结构优化降低自重。
                  - listitem [ref=e493]:
                    - paragraph [ref=e494]:
                      - strong [ref=e495]: 风电安装企业
                      - text: ：需要大臂长与稳定变幅性能，适配风电检修场景。
                  - listitem [ref=e496]:
                    - paragraph [ref=e497]:
                      - strong [ref=e498]: 基建总包
                      - text: ：关注综合性价比与交付周期。
                - heading "四、近年销量走势" [level=2] [ref=e499]
                - paragraph [ref=e500]: 表1展示了XCT80L7型汽车起重机近年销量走势，具体数据【待补充】。从调研反馈看，产品销量与基建投资、风电装机量及租赁市场需求呈正相关趋势。
