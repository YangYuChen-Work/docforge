<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMO演示平台 - 在线编辑</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="page-doc.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-header"><h1>DEMO演示平台</h1></div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-label">功能导航</div>
                    <a href="index.html" class="nav-item"><span class="nav-icon">🧪</span><span>AI 测试用例生成</span></a>
                    <a href="doc-assistant.html" class="nav-item active"><span class="nav-icon">📄</span><span>AI 文档助手</span></a>
                    <a href="module-select.html" class="nav-item"><span class="nav-icon">⚙️</span><span>产品模块智能选配</span></a>
                </div>
                <div class="nav-section">
                    <div class="nav-label">系统配置</div>
                    <a href="rules-config.html" class="nav-item sub"><span class="nav-icon">•</span><span>转换规则</span></a>
                    <a href="audit.html" class="nav-item sub"><span class="nav-icon">•</span><span>日志审计</span></a>
                    <a href="doc-config.html" class="nav-item sub"><span class="nav-icon">•</span><span>文档助手配置</span></a>
                    <a href="module-rules.html" class="nav-item sub"><span class="nav-icon">•</span><span>模块配置规则库</span></a>
                </div>
            </nav>
        </aside>

        <main class="main-content" style="padding:0; display:flex; flex-direction:column;">
            <!-- Editor Top Bar -->
            <div class="editor-topbar">
                <div class="editor-topbar-left">
                    <h2 class="editor-doc-title">起重机电控系统 PRD</h2>
                    <span class="editor-breadcrumb">AI 文档助手 / 在线编辑</span>
                </div>
                <div class="editor-topbar-right" style="display:flex; align-items:center; gap:12px;">
                    <div class="export-btn-wrap" style="position:relative;">
                        <button class="btn btn-primary" style="font-size:12px; padding:5px 14px;" onclick="toggleExportMenu(event)">一键导出 &#x25be;</button>
                        <div id="exportDropdown" class="export-dropdown" style="display:none;">
                            <div class="export-drop-title">选择导出格式</div>
                            <div class="export-drop-item" onclick="exportDoc('ppt')">
                                <span class="export-fmt-icon" style="background:#ff6b35;">P</span>
                                <div>
                                    <div class="export-fmt-name">PowerPoint (.pptx)</div>
                                    <div class="export-fmt-desc">导出为演示文稿，适合评审汇报</div>
                                </div>
                            </div>
                            <div class="export-drop-item" onclick="exportDoc('word')">
                                <span class="export-fmt-icon" style="background:#2b5eb8;">W</span>
                                <div>
                                    <div class="export-fmt-name">Word (.docx)</div>
                                    <div class="export-fmt-desc">导出为可编辑文档，适合继续修订</div>
                                </div>
                            </div>
                            <div class="export-drop-item" onclick="exportDoc('pdf')">
                                <span class="export-fmt-icon" style="background:#e03030;">P</span>
                                <div>
                                    <div class="export-fmt-name">PDF (.pdf)</div>
                                    <div class="export-fmt-desc">导出为固定格式，适合归档和分发</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Editor Toolbar -->
            <div class="editor-toolbar">
                <button class="tb-btn">↩</button>
                <button class="tb-btn">↪</button>
                <span class="tb-sep"></span>
                <select class="tb-select"><option>正文</option><option>标题1</option><option>标题2</option></select>
                <select class="tb-select" style="width:60px"><option>标题 1</option></select>
                <select class="tb-select" style="width:50px"><option>11</option><option>14</option><option>16</option></select>
                <span class="tb-sep"></span>
                <button class="tb-btn"><b>B</b></button>
                <button class="tb-btn"><i>I</i></button>
                <button class="tb-btn"><u>U</u></button>
                <span class="tb-sep"></span>
                <button class="tb-btn">≡</button>
                <button class="tb-btn">☰</button>
                <button class="tb-btn">🔗</button>
                <button class="tb-btn">⋯</button>
            </div>

            <!-- Editor Body: 3-column layout -->
            <div class="editor-body">
                <!-- Left: Document Outline -->
                <div class="editor-outline">
                    <div class="outline-header">
                        <div class="outline-title">Loading...</div>
                        <div class="outline-saved"><span class="saved-badge">已保存</span> 自动保存 10:42</div>
                    </div>
                    <div class="outline-section-title">文档目录</div>
                    <div class="outline-tree">
                        <!-- Dynamic rendering by doc-app.js -->
                    </div>
                    <div class="outline-add">+ 新增章节</div>
                </div>

                <!-- Center: Document Content -->
                <div class="editor-content">
                    <!-- Dynamic rendering by doc-app.js -->
                </div>

                 <!-- Right: AI Collaboration Panel -->
                <div class="editor-ai-panel">
                    <div class="ai-panel-header">
                        <h4>协作侧栏</h4>
                        <p class="ai-panel-desc">围绕当前选区、引用批注和历史资料与 AI 对话。</p>
                    </div>
                    <div class="ai-panel-tabs">
                        <button class="ai-tab active" onclick="switchAiTab('annotate', this)">批注 3</button>
                        <button class="ai-tab" onclick="switchAiTab('chat', this)">AI助手</button>
                    </div>
                    <!-- Annotation Mode -->
                    <div class="ai-tab-content" id="tab-annotate">
                        <!-- Dynamic rendering by doc-app.js -->
                    </div>
                    <!-- Chat Mode -->
                    <div class="ai-tab-content" id="tab-chat" style="display:none;">
                        <!-- Dynamic rendering by doc-app.js -->
                    </div>
                    <!-- Chat Input -->
                    <div class="ai-chat-input">
                        <input type="text" placeholder="继续追问或输入修改要求..." class="chat-input-field" onkeydown="if(event.key==='Enter')sendChatMessage()">
                        <button class="chat-send-btn" onclick="sendChatMessage()">&#x27A4;</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="doc-data.js"></script>
    <script src="doc-app.js"></script>
</body>
</html>
