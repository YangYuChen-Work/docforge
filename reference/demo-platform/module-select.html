<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMO演示平台 - 产品模块智能选配</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="module.css">
</head>
<body>
<div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header"><h1>DEMO演示平台</h1></div>
        <nav class="sidebar-nav">
            <div class="nav-section">
                <div class="nav-label">功能导航</div>
                <a href="index.html" class="nav-item"><span class="nav-icon">🧪</span><span>AI 测试用例生成</span></a>
                <a href="doc-assistant.html" class="nav-item"><span class="nav-icon">📄</span><span>AI 文档助手</span></a>
                <a href="module-select.html" class="nav-item active"><span class="nav-icon">⚙️</span><span>产品模块智能选配</span></a>
            </div>
            <div class="nav-section">
                <div class="nav-label">系统配置</div>
                <a href="rules-config.html" class="nav-item sub"><span class="nav-icon">•</span><span>转换规则</span></a>
                <a href="audit.html" class="nav-item sub"><span class="nav-icon">•</span><span>日志审计</span></a>
                <a href="doc-config.html" class="nav-item sub"><span class="nav-icon">•</span><span>文档助手配置</span></a>
                <a href="module-rules.html" class="nav-item sub"><span class="nav-icon">•</span><span>模块配置规则库</span></a>
            </div>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="page-header" style="border-bottom:none; padding-bottom:8px;">
            <div class="header-left">
                <h2>产品模块智能选配</h2>
                <p class="subtitle">基于产品配置式设计过程，完成Top-down选配、差异识别、计算校验与BOM导出</p>
            </div>
            <div class="header-right" id="headerBadges"></div>
        </header>

        <!-- Stats -->
        <div class="module-stats" id="statsRow"></div>

        <!-- Body -->
        <div class="module-body">
            <!-- Left: task list -->
            <div class="module-list-area">
                <div>
                    <div class="mod-section-title">模块化配置任务</div>
                    <div class="mod-section-desc">按项目和产品型号管理平台实例、系统、子系统和总成组件的智能选配任务。</div>
                </div>
                <!-- Filters & search -->
                <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;">
                    <div class="filter-tabs" id="filterTabs">
                        <button class="filter-tab active" onclick="filterTasks('all', this)">全部</button>
                        <button class="filter-tab" onclick="filterTasks('configuring', this)">配置中</button>
                        <button class="filter-tab" onclick="filterTasks('checking', this)">待校验</button>
                        <button class="filter-tab" onclick="filterTasks('exportable', this)">可导出BOM</button>
                    </div>
                    <div class="search-row" style="margin:0; flex:1; max-width:240px;">
                        <input class="search-input" id="searchInput" placeholder="🔍 搜索项目/型号/平台" oninput="filterTasks(currentFilter, null)">
                    </div>
                </div>
                <!-- Table -->
                <table class="module-table">
                    <thead>
                        <tr>
                            <th>配置任务</th>
                            <th>产品/平台</th>
                            <th>状态</th>
                            <th>更新时间</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="taskTableBody"></tbody>
                </table>
            </div>

            <!-- Right: action panel -->
            <div class="module-sidebar-panel">
                <!-- New task panel -->
                <div class="action-panel">
                    <div class="action-panel-title">新建配置任务</div>
                    <div class="action-panel-desc">从产品大类和关键参数开始，系统按Top-down路径逐层推荐并生成BOM。</div>
                    <button class="btn btn-primary" style="width:100%; padding:12px; font-size:14px;" onclick="startNewTask()">新建配置任务</button>
                </div>
                <!-- AI assistant -->

            </div>
        </div>
    </main>
</div>
<script src="module-data.js"></script>
<script src="module-app.js"></script>
<script>
    initSelectPage();
</script>
</body>
</html>
