<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMO演示平台 - 模块配置规则库</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="module.css">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="sidebar-header"><h1>DEMO演示平台</h1></div>
        <nav class="sidebar-nav">
            <div class="nav-section">
                <div class="nav-label">功能导航</div>
                <a href="index.html" class="nav-item"><span class="nav-icon">🧪</span><span>AI 测试用例生成</span></a>
                <a href="doc-assistant.html" class="nav-item"><span class="nav-icon">📄</span><span>AI 文档助手</span></a>
                <a href="module-select.html" class="nav-item"><span class="nav-icon">⚙️</span><span>产品模块智能选配</span></a>
            </div>
            <div class="nav-section">
                <div class="nav-label">系统配置</div>
                <a href="rules-config.html" class="nav-item sub"><span class="nav-icon">•</span><span>转换规则</span></a>
                <a href="audit.html" class="nav-item sub"><span class="nav-icon">•</span><span>日志审计</span></a>
                <a href="doc-config.html" class="nav-item sub"><span class="nav-icon">•</span><span>文档助手配置</span></a>
                <a href="module-rules.html" class="nav-item sub active"><span class="nav-icon">•</span><span>模块配置规则库</span></a>
            </div>
        </nav>
    </aside>

    <main class="main-content">
        <header class="page-header" style="border-bottom:none; padding-bottom:8px;">
            <div class="header-left">
                <div class="breadcrumb">
                    <span class="breadcrumb-link" style="color:#888;">系统配置</span>
                    <span class="breadcrumb-sep">/</span>
                    <span class="breadcrumb-current">模块化配置规则</span>
                </div>
                <p class="subtitle">维护产品模块智能选配所需的规则库、参数库、公式库、知识图谱与基线版本</p>
            </div>
            <div class="header-right" id="rulesHeaderStats"></div>
        </header>

        <div class="rules-layout">
            <!-- Left: asset list -->
            <div class="rules-left">
                <div class="mod-section-title" style="margin-bottom:4px;">配置资产</div>
                <div class="mod-section-desc">业务侧请只读已启用资产；管理员在此维护检索、规则和公式。</div>
                <div class="search-row">
                    <input class="search-input" placeholder="🔍 搜索规则、参数、公式、基线" id="assetSearch" oninput="filterAssets(this.value)">
                </div>
                <div id="assetList"></div>
                <div style="display:flex; gap:8px; margin-top:16px; padding-top:16px; border-top:1px solid #f0f0f0;">
                    <button class="btn btn-outline" style="flex:1;" onclick="alert('新增规则功能（演示）')">新增规则</button>
                    <button class="btn btn-outline" style="flex:1;" onclick="alert('导入资产功能（演示）')">导入资产</button>
                </div>
            </div>

            <!-- Right: rule detail -->
            <div class="rules-right" id="ruleDetailPanel">
                <div style="text-align:center; padding:80px 20px; color:#ccc;">
                    <div style="font-size:36px; margin-bottom:12px;">📋</div>
                    <p>点击左侧资产查看详情</p>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="module-data.js"></script>
<script src="module-app.js"></script>
<script>
    initRulesPage();
</script>
</body>
</html>
