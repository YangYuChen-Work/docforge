[project]
name = "docforge"
version = "0.1.0"
description = "Local project document-generation proof of concept"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.14.0",
    "fastapi==0.115.5",
    "httpx==0.28.1",
    "openai==1.58.1",
    "openpyxl==3.1.5",
    "Pillow==11.1.0",
    "pydantic-settings==2.6.1",
    "pydantic==2.10.3",
    "python-docx==1.1.2",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.20",
    "requests==2.32.3",
    "sqlalchemy==2.0.36",
    "uvicorn[standard]==0.32.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
]

[tool.uv]
package = false
